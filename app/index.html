<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wochenteller – Rezept- & Einkaufsplaner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Courier+Prime:wght@400;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#F2F5F0;--surface:#FFFFFF;--ink:#17201A;--muted:#5A685E;--line:#D5DDD2;
  --green:#1F4D36;--green-soft:#E1EBE0;--on-green:#FFFFFF;
  --beet:#A3245A;--beet-soft:#F5E1EA;--on-beet:#FFFFFF;
  --paper:#FBFAF5;--paper-ink:#23211C;--paper-line:#CFC9B9;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111613;--surface:#1A211C;--ink:#E7EDE6;--muted:#9AA89D;--line:#2E3A32;
    --green:#86C9A1;--green-soft:#1F3328;--on-green:#0D1A12;
    --beet:#EC86B1;--beet-soft:#3A1F2C;--on-beet:#2A0F1C;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111613;--surface:#1A211C;--ink:#E7EDE6;--muted:#9AA89D;--line:#2E3A32;
  --green:#86C9A1;--green-soft:#1F3328;--on-green:#0D1A12;
  --beet:#EC86B1;--beet-soft:#3A1F2C;--on-beet:#2A0F1C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
.display{font-family:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 12px}
.brand{display:flex;align-items:center;gap:8px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:1.3rem;letter-spacing:-.02em;color:var(--green)}
.brand svg{width:26px;height:26px}
h1{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:clamp(1.9rem,6.5vw,2.7rem);line-height:1.06;letter-spacing:-.025em;margin:.15em 0 .3em}
.sub{color:var(--muted);margin:0 0 22px;max-width:54ch}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--green);transition:width .3s ease}
.stepno{font-size:.9rem;color:var(--muted);margin:22px 0 0}
h2.group{font-size:1rem;font-weight:600;margin:26px 0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px 14px 12px;min-height:92px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:background .15s,border-color .15s}
.tile .e{font-size:1.75rem;line-height:1}
.tile .l{font-weight:600;line-height:1.25;padding-right:22px}
.tile .s{font-size:.82rem;color:var(--muted);line-height:1.3}
.tile[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft);box-shadow:inset 0 0 0 1px var(--green)}
.tile[aria-pressed="true"]::after{content:"✓";position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--green);color:var(--on-green);font-size:.78rem;font-weight:700;display:grid;place-items:center}
.tile.no[aria-pressed="true"]{border-color:var(--beet);background:var(--beet-soft);box-shadow:inset 0 0 0 1px var(--beet)}
.tile.no[aria-pressed="true"]::after{content:"✕";background:var(--beet);color:var(--on-beet)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.95rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.chip.no[aria-pressed="true"]{background:var(--beet);border-color:var(--beet);color:var(--on-beet)}
.bar{position:sticky;bottom:0;display:flex;gap:12px;align-items:center;padding:16px 0 calc(16px + env(safe-area-inset-bottom,0px));margin-top:30px;background:linear-gradient(to top,var(--bg) 75%,transparent)}
.btn{font:inherit;font-weight:600;padding:14px 22px;border-radius:12px;border:0;cursor:pointer}
.primary{background:var(--green);color:var(--on-green);flex:1;max-width:340px;margin-left:auto}
.primary:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.link{background:none;border:0;color:var(--green);font:inherit;font-weight:600;cursor:pointer;padding:8px 0}
:focus-visible{outline:3px solid var(--beet);outline-offset:2px}
.stepper{display:flex;align-items:center;gap:22px;margin:4px 0}
.stepper button{width:54px;height:54px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.6rem;line-height:1;cursor:pointer}
.stepper output{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:3.4rem;font-weight:700;min-width:2ch;text-align:center}
.budget output{display:block;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:clamp(3.5rem,14vw,5rem);font-weight:800;letter-spacing:-.03em;line-height:1}
.budget .per{display:block;color:var(--muted);margin:6px 0 22px}
.budget input{width:100%;accent-color:var(--green);height:32px}
.range-ends{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem}
.hint{font-size:.9rem;color:var(--muted);margin:14px 0 0}
.warn{background:var(--beet-soft);border-radius:12px;padding:14px 16px;margin:16px 0}
/* plan */
.budgetcard{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;margin:8px 0 14px}
.bc-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.bc-total{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:2rem;font-weight:800;letter-spacing:-.02em}
.bc-of{color:var(--muted)}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:10px 0 8px}
.meter span{display:block;height:100%;background:var(--green)}
.meter.over span{background:var(--beet)}
.bc-msg{font-size:.92rem;margin:0}
.stores{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin:0 -2px}
.store{flex:none;display:flex;flex-direction:column;align-items:flex-start;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.store small{color:var(--muted);font-size:.8rem}
.store[aria-pressed="true"]{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.tabs{display:flex;gap:4px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:4px;margin:16px 0 20px}
.tab{flex:1;padding:10px;border:0;background:none;border-radius:9px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--green);color:var(--on-green)}
.day{margin:0 0 20px}
.day h2{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:1.35rem;font-weight:700;letter-spacing:-.01em;margin:0 0 8px}
.meal{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;margin-bottom:8px}
.meal summary{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;list-style:none}
.meal summary::-webkit-details-marker{display:none}
.meal[open]{border-color:var(--green)}
.em{width:46px;height:46px;border-radius:12px;background:var(--green-soft);display:grid;place-items:center;font-size:1.45rem;flex:none}
.meal.left .em{background:var(--beet-soft)}
.mt{flex:1;min-width:0;display:flex;flex-direction:column}
.ml{font-size:.8rem;color:var(--muted)}
.mn{font-weight:600;line-height:1.3}
.tm{font-size:.85rem;color:var(--muted);white-space:nowrap}
.md{padding:4px 16px 16px;border-top:1px solid var(--line)}
.ings{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0}
.ings dt{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ings dd{margin:0}
.md ol{padding-left:1.25em;margin:12px 0}
.md li{margin-bottom:6px;max-width:62ch}
.note{font-size:.9rem;color:var(--muted);margin:10px 0}
.small-btn{font:inherit;font-size:.9rem;font-weight:600;padding:9px 14px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.receipt{position:relative;background:var(--paper);color:var(--paper-ink);font-family:'Courier Prime',ui-monospace,Menlo,Consolas,monospace;padding:24px 20px 20px;border-radius:6px 6px 0 0;margin:0 0 34px;box-shadow:0 0 0 1px var(--line)}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:12px;background:linear-gradient(135deg,var(--paper) 50%,transparent 50%) 0 0/12px 12px repeat-x,linear-gradient(225deg,var(--paper) 50%,transparent 50%) 0 0/12px 12px repeat-x}
.rtitle{text-align:center;font-weight:700;font-size:1.15rem}
.rsub{text-align:center;font-size:.85rem;opacity:.75;margin-bottom:8px}
.receipt h3{font-size:.9rem;margin:16px 0 4px;padding-top:12px;border-top:1px dashed var(--paper-line);font-weight:700}
.row{display:flex;align-items:flex-start;gap:10px;padding:6px 0;cursor:pointer}
.row input{margin-top:3px;width:18px;height:18px;accent-color:#1F4D36;flex:none}
.rn{flex:1;line-height:1.35}
.rn small{display:block;font-size:.8rem;opacity:.7}
.rp{white-space:nowrap;font-variant-numeric:tabular-nums}
.row.done .rn,.row.done .rp{text-decoration:line-through;opacity:.45}
.rtotal{display:flex;justify-content:space-between;font-weight:700;font-size:1.15rem;border-top:2px solid var(--paper-ink);margin-top:14px;padding-top:10px}
.rline{display:flex;justify-content:space-between;font-size:.9rem;margin-top:4px}
.have{font-size:.85rem;margin-top:16px;padding-top:12px;border-top:1px dashed var(--paper-line);opacity:.85}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.foot{font-size:.82rem;color:var(--muted);margin:10px 0 44px;max-width:62ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>
.tabs .tab{padding:10px 6px;font-size:.95rem}
.day-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 8px}
.day-head h2{margin:0}
.kcal{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.kcal.hi{color:var(--beet);font-weight:600}
.day.off{opacity:.75}
.offrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:transparent;border:1.5px dashed var(--line);border-radius:14px;padding:12px 14px;color:var(--muted)}
.tm{display:flex;flex-direction:column;align-items:flex-end;line-height:1.3}
.meal.done .mn{text-decoration:line-through;text-decoration-thickness:1.5px}
.meal.done .em::after{content:"✓";position:absolute}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.small-btn.ok{background:var(--green);border-color:var(--green);color:var(--on-green)}
.daysel{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daysel .tile{min-height:64px;align-items:center;justify-content:center;padding:10px 4px}
.daysel .tile .l{padding:0;font-size:1.05rem}
.daysel .tile[aria-pressed="true"]::after{display:none}
.toggle2{display:flex;gap:8px;margin-bottom:18px}
.fform{display:grid;grid-template-columns:1fr 110px auto;gap:8px;align-items:end;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin:0 0 18px}
.fform label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.fform select,.fform input{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px;min-width:0;width:100%}
@media (max-width:480px){.fform{grid-template-columns:1fr 1fr}.fform .full{grid-column:1/-1}.fform button{grid-column:1/-1}}
.fcat{font-size:.95rem;font-weight:600;margin:20px 0 8px}
.fitem{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.fitem .fn{flex:1;min-width:0;line-height:1.3}
.fitem .fn small{display:block;font-size:.8rem;color:var(--muted)}
.fitem .fn small.warn2{color:var(--beet)}
.fitem .fq{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.ib{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:1.05rem;cursor:pointer;flex:none}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted)}
.cover{font-size:.8rem;color:var(--muted)}
.finish{width:100%;margin:-14px 0 24px}
.hright{display:flex;align-items:center;gap:14px;min-width:0}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:1.1rem;flex:none}
.who{display:flex;align-items:center;gap:7px;min-width:0;max-width:150px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:3px 12px 3px 3px;font:inherit;font-size:.9rem;font-weight:600;color:var(--ink);cursor:pointer}
.who .av{width:28px;height:28px;font-size:.8rem}
.who .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist{display:grid;gap:8px;margin:0 0 18px}
.pitem{display:flex;gap:8px;align-items:center}
.pbtn{flex:1;display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;font:inherit;font-size:1.1rem;font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
.fform.pform{grid-template-columns:1fr auto}
.tabs .tab{padding:10px 4px;font-size:.88rem}
.rsearch input{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
@media (max-width:480px){.fform.pform{grid-template-columns:1fr}}
</style>

</head>

/* ---------- Logik ---------- */
function exTags(){
  const t=new Set();
  const D={vegetarisch:['fleisch','fisch','schalentier'],pescetarisch:['fleisch'],vegan:['fleisch','fisch','schalentier','milch','ei']};
  (D[S.diet]||[]).forEach(x=>t.add(x));
  if(S.extras.includes('glutenfrei'))t.add('gluten');
  if(S.extras.includes('laktosefrei'))t.add('laktose');
  S.allergies.forEach(a=>t.add(a));
  PROT.forEach(([k])=>{if(!S.proteins.includes(k)){if(k==='fisch'){t.add('fisch');t.add('schalentier')}else t.add(k)}});
  return t;
}
function canCook(r){return r.need.split(' ').filter(Boolean).every(g=>[...g].some(c=>S.appliances.includes(AP[c])))}
function eligible(r,ex){
  if(!canCook(r))return false;
  for(const id of Object.keys(r.i)){const g=INGS[id];if(g.tags.some(t=>ex.has(t)))return false;if(S.blocked.includes(id)&&!g.minor)return false}
  return true;
}
function effIng(r){return Object.entries(r.i).filter(([id])=>!S.blocked.includes(id))}
function kcalOf(r){let k=0;for(const [id,q] of effIng(r))k+=q*INGS[id].kcal;return Math.round(k/10)*10}
function currentStore(){if(S.store&&S.stores.includes(S.store))return S.store;return [...S.stores].sort((a,b)=>STORE_MULT[a]-STORE_MULT[b])[0]||'hofer'}
function servingCost(r,mult){let c=0;for(const [id,q] of effIng(r)){if(S.pantry.includes(id))continue;const g=INGS[id];c+=q*g.price/g.pack*mult}return c}
function styleMatch(r,mult){let m=0;for(const s of S.styles){if(s==='mealprep')continue;if(s==='schnell'){if(r.t<=25)m++}else if(s==='guenstig'){if(servingCost(r,mult)<=1.6)m++}else if(r.s.includes(s))m++}return m}
function overlapCount(r,set){let n=0;for(const [id] of effIng(r)){const g=INGS[id];if(!g.minor&&!S.pantry.includes(id)&&set.has(id))n++}return n}
function fridgeUse(r){let n=0;for(const [id] of effIng(r)){if(!INGS[id].minor&&!S.pantry.includes(id)&&(S.fridge[id]||0)>0)n++}return n}
function kcalFit(r,m){if(!S.kcal)return 1;const tg=S.kcal*(KSHARE[S.meals][m]||.35);const d=(kcalOf(r)-tg)/(0.3*tg);return 0.12+Math.exp(-d*d)}
function wpick(arr,fn){const ws=arr.map(fn);const tot=ws.reduce((a,b)=>a+b,0);let x=Math.random()*tot;for(let i=0;i<arr.length;i++){x-=ws[i];if(x<=0)return arr[i]}return arr[arr.length-1]}
function mealTypes(){return {abend:['abend'],mittag_abend:['mittag','abend'],alle:['frueh','mittag','abend']}[S.meals]}
const skey=(d,m)=>d+'-'+m;
function planNeeds(plan){
  const needs={};const p=S.persons;
  const add=(r,f)=>effIng(r).forEach(([id,q])=>needs[id]=(needs[id]||0)+q*f);
  plan.units.forEach(u=>{if(!S.cooked[skey(u.slots[0].d,u.slots[0].m)])add(RBY[u.rid],u.slots.length*p)});
  if(plan.bf)Object.entries(plan.bf).forEach(([d,id])=>{if(!S.cooked[skey(d,'frueh')])add(RBY[id],p)});
  return needs;
}
function shopping(needs,mult){
  const items=[],have=[],fromFridge=[];let total=0;
  for(const [id,q] of Object.entries(needs)){
    const g=INGS[id];
    if(S.pantry.includes(id)){have.push(g);continue}
    const rem=q-(S.fridge[id]||0);
    if(rem<=1e-6){fromFridge.push(g);continue}
    const packs=Math.max(1,Math.ceil(rem/g.pack-1e-6));
    const price=packs*g.price*mult;total+=price;
    items.push({g,need:rem,packs,price,rest:packs*g.pack-rem});
  }
  return {items,have,fromFridge,total};
}
function slotCount(){return S.days.length*mealTypes().filter(m=>m!=='frueh').length}
function targetPerServing(n){const bf=mealTypes().includes('frueh')?S.days.length*0.45:0;return S.budget/Math.max(1,n+bf)/S.persons}
function weight(r,sl,used,set,per,mult,keep){
  let w=1+1.6*styleMatch(r,mult);
  if(used[r.id])w*=0.02;
  if(keep&&keep.has(r.id))w*=2.5;
  if(S.saved.includes(r.id))w*=2;
  w*=1+0.35*overlapCount(r,set);
  w*=1+0.6*fridgeUse(r);
  const wk=sl[0].d<5;
  if(wk&&r.t>45)w*=0.35;
  if(!wk&&r.t>=35)w*=1.3;
  const c=servingCost(r,mult);
  if(c>per)w*=Math.pow(per/c,S.styles.includes('guenstig')?3:2);
  w*=kcalFit(r,sl[0].m);
  return w;
}
function scorePlan(plan,mult){
  const {total}=shopping(planNeeds(plan),mult);
  const over=Math.max(0,total-S.budget);
  let st=0,kd=0;const ids=new Set(),cz=new Set();
  plan.units.forEach(u=>{const r=RBY[u.rid];st+=styleMatch(r,mult);ids.add(u.rid);r.s.forEach(s=>{if(CUISINES.includes(s))cz.add(s)});
    if(S.kcal){const tg=S.kcal*(KSHARE[S.meals][u.slots[0].m]||.35);kd+=Math.abs(kcalOf(r)-tg)/tg*u.slots.length}});
  return st+ids.size*1.0+cz.size*0.6-over*5-total*0.06-kd*3;
}
function buildUnits(slots,mp){
  if(!mp)return slots.map(s=>[s]);
  const u=[];let i=0;
  while(i<slots.length){const a=slots[i],b=slots[i+1];if(b&&b.d-a.d===1){u.push([a,b]);i+=2}else{u.push([a]);i++}}
  return u;
}
function generate(keepPrev){
  genError='';
  const ex=exTags();
  const mains=RECIPES.filter(r=>r.type==='m'&&eligible(r,ex));
  const bfs=RECIPES.filter(r=>r.type==='f'&&eligible(r,ex));
  if(!mains.length){genError='Mit diesen Einstellungen passt leider kein Gericht. Wähle mehr Küchengeräte oder Proteinquellen aus, oder entferne ein paar blockierte Zutaten.';return false}
  const keep=keepPrev&&S.plan?new Set(S.plan.units.map(u=>u.rid)):null;
  const mt=mealTypes(),days=[...S.days].sort((a,b)=>a-b);
  const slots=[];for(const d of days)for(const m of ['mittag','abend'])if(mt.includes(m))slots.push({d,m});
  const units=buildUnits(slots,S.styles.includes('mealprep'));
  const mult=STORE_MULT[currentStore()];
  const per=targetPerServing(slots.length);
  let best=null,bestScore=-Infinity;
  for(let k=0;k<240;k++){
    const used={},set=new Set(),us=[];
    for(const sl of units){
      const r=wpick(mains,r=>weight(r,sl,used,set,per,mult,keep));
      used[r.id]=1;effIng(r).forEach(([id])=>{if(!INGS[id].minor)set.add(id)});
      us.push({slots:sl,rid:r.id});
    }
    let bf=null;
    if(mt.includes('frueh')&&bfs.length){
      const fw=r=>(1+styleMatch(r,mult)+0.3*overlapCount(r,set)+0.4*fridgeUse(r))*kcalFit(r,'frueh');
      const a=wpick(bfs,fw);const rest=bfs.filter(x=>x!==a);const b=rest.length?wpick(rest,fw):a;
      bf={};days.forEach((d,i)=>bf[d]=(i%2?b:a).id);
    }
    const plan={units:us,bf,noBf:mt.includes('frueh')&&!bfs.length};
    const sc=scorePlan(plan,mult);
    if(sc>bestScore){bestScore=sc;best=plan}
  }
  best.fewRecipes=mains.length<units.length;
  S.plan=best;S.checked={};S.cooked={};save();return true;
}
function swapUnit(i){
  const ex=exTags(),mult=STORE_MULT[currentStore()];
  const cur=S.plan.units[i];const used=new Set(S.plan.units.map(u=>u.rid));
  const others=RECIPES.filter(r=>r.type==='m'&&r.id!==cur.rid&&eligible(r,ex));
  if(!others.length)return;
  const per=targetPerServing(slotCount());
  const r=wpick(others,r=>(used.has(r.id)?0.08:1)*(1+1.6*styleMatch(r,mult))*(1+0.6*fridgeUse(r))*kcalFit(r,cur.slots[0].m)*Math.min(1,Math.pow(per/Math.max(servingCost(r,mult),.01),2)));
  cur.rid=r.id;S.checked={};save();
}
function swapBf(d){
  const ex=exTags(),cur=S.plan.bf[d];
  const others=RECIPES.filter(r=>r.type==='f'&&r.id!==cur&&eligible(r,ex));
  if(!others.length)return;
  S.plan.bf[d]=wpick(others,r=>(1+styleMatch(r,STORE_MULT[currentStore()]))*kcalFit(r,'frueh')).id;S.checked={};save();
}
function cook(key){
  const [d,m]=key.split('-');let r,f;
  if(m==='frueh'){r=RBY[S.plan.bf[d]];f=S.persons}
  else{const u=S.plan.units.find(u=>skey(u.slots[0].d,u.slots[0].m)===key);if(!u)return;r=RBY[u.rid];f=u.slots.length*S.persons}
  const undo=!!S.cooked[key];
  for(const [id,q] of effIng(r)){
    if(S.pantry.includes(id))continue;
    const cur=S.fridge[id]||0;
    const nv=undo?cur+q*f:Math.max(0,cur-q*f);
    if(nv<=1e-6)delete S.fridge[id];else S.fridge[id]=nv;
  }
  if(undo)delete S.cooked[key];else S.cooked[key]=true;
  const lg=S.cookLog[r.id]||{n:0,last:null};
  if(undo){lg.n=Math.max(0,lg.n-1);if(!lg.n){delete S.cookLog[r.id]}else S.cookLog[r.id]=lg}
  else{lg.n++;lg.last=new Date().toISOString().slice(0,10);S.cookLog[r.id]=lg}
}
function finishShopping(){
  const shop=shopping(planNeeds(S.plan),1);
  shop.items.forEach(it=>{if(S.checked[it.g.id])S.fridge[it.g.id]=(S.fridge[it.g.id]||0)+it.packs*it.g.pack});
  S.checked={};
}
function fstep(g){return g.unit==='g'||g.unit==='ml'?(g.pack>=500?50:25):1}

/* ---------- Formatierung ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=n=>n.toFixed(2).replace('.',',')+' €';
const num=n=>Math.round(n).toLocaleString('de-AT');
function frac(q){const r=Math.round(q*4)/4;if(r===0)return '¼';const w=Math.floor(r),f=r-w;const fs={0:'',0.25:'¼',0.5:'½',0.75:'¾'}[f];return ((w?w:'')+fs)||'0'}
function fmtQty(q,u){
  if(u==='g'||u==='ml'){if(q>=1000)return String(Math.round(q/100)/10).replace('.',',')+(u==='g'?' kg':' l');const v=q<20?Math.round(q):Math.round(q/5)*5;return v+' '+u}
  const lab={Stk:'Stk',Zehe:(q>1?'Zehen':'Zehe'),EL:'EL',TL:'TL',Bund:'Bund'}[u]||u;
  return frac(q)+' '+lab;
}

}
function chip(key,val,label,cls=''){return `<button class="chip ${cls}" aria-pressed="${S[key].includes(val)}" data-act="toggle" data-key="${key}" data-val="${esc(val)}">${esc(label)}</button>`}
function perServingText(){const n=S.days.length*mealTypes().length*S.persons;return n?`rund ${eur(S.budget/n)} pro Portion bei ${n} Portionen`:'Wähle mindestens einen Tag'}

  const sh=KSHARE[S.meals];const parts=Object.entries(sh).map(([m,f])=>`${MEAL_LABEL[m]} ca. ${num(S.kcal*f)} kcal`);
  return parts.join(', ')+'. Der Rest bleibt für Snacks und ungeplante Mahlzeiten.';
}

  {q:'Was ist gerade im Kühlschrank?',sub:'Tippe an, was du da hast. Wir planen es bevorzugt ein. Mengen kannst du später im Kühlschrank-Tab genau einstellen.',

  {q:'Gibt es etwas, das du nicht magst?',sub:'Kleinigkeiten wie Zwiebeln, Knoblauch oder Kräuter lassen wir im Rezept weg. Bei Hauptzutaten bekommst du ein anderes Gericht.',
   body:()=>`<div class="chips">${Object.values(INGS).filter(g=>g.cat!=='Gewürze & Öle').sort((a,b)=>a.name.localeCompare(b.name,'de')).map(g=>chip('blocked',g.id,g.name,'no')).join('')}</div>`+(genError?`<p class="warn" role="alert">${esc(genError)}</p>`:'')}
];
const BRAND=`<span class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="16" cy="16" r="8" fill="none" stroke="currentColor" stroke-width="2"/>${[0,1,2,3,4,5,6].map(i=>{const a=i/7*Math.PI*2-Math.PI/2;return `<circle cx="${(16+11*Math.cos(a)).toFixed(2)}" cy="${(16+11*Math.sin(a)).toFixed(2)}" r="1.4" fill="currentColor"/>`}).join('')}</svg>Wochenteller</span>`;
function renderWizard(){
  const st=STEPS[step],last=step===STEPS.length-1;
  return `<header class="top">${BRAND}<span class="hright">${S.plan?'<button class="link" data-act="toplan">Zum Plan</button>':''}${who()}</span></header>
  <div class="progress" role="progressbar" aria-label="Fortschritt" aria-valuemin="1" aria-valuemax="${STEPS.length}" aria-valuenow="${step+1}"><span style="width:${(step+1)/STEPS.length*100}%"></span></div>
  <main><p class="stepno">Schritt ${step+1} von ${STEPS.length}</p><h1>${st.q}</h1>${st.sub?`<p class="sub">${st.sub}</p>`:''}${st.body()}</main>
  <footer class="bar">${step>0?'<button class="btn ghost" data-act="back">Zurück</button>':''}<button class="btn primary" data-act="next" ${st.ok&&!st.ok()?'disabled':''}>${last?'Wochenplan erstellen':'Weiter'}</button></footer>`;
}

/* ---------- Plan ---------- */
function recipeBody(r,f){
  const ings=effIng(r).map(([id,q])=>{const g=INGS[id];const has=(S.fridge[id]||0)>0||S.pantry.includes(id);return `<dt>${fmtQty(q*f,g.unit)}</dt><dd>${esc(g.name)}${has?' <span class="cover">(da)</span>':''}</dd>`}).join('');
  return `<dl class="ings">${ings}</dl><p class="note">Für ${f} ${f===1?'Portion':'Portionen'}, ca. ${num(kcalOf(r))} kcal pro Portion. Salz und Pfeffer nach Geschmack.</p><ol>${r.st.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${favBtn(r)}`;
}
function favBtn(r){const f=S.saved.includes(r.id);return `<div class="btnrow"><button class="small-btn ${f?'ok':''}" data-act="fav" data-val="${r.id}" aria-pressed="${f}">${f?'♥ Gemerkt':'♡ Merken'}</button></div>`}
function cookInfo(r){const l=S.cookLog[r.id];if(!l)return '';const d=l.last?l.last.split('-').reverse().slice(0,2).join('.')+'.':'';return `${l.n}× gekocht${d?', zuletzt '+d:''}`}
function recipeListHTML(){
  const ex=exTags();const q=rQuery.trim().toLowerCase();
  let list=RECIPES.slice();
  if(rFilter==='saved')list=list.filter(r=>S.saved.includes(r.id));
  else if(rFilter==='fit')list=list.filter(r=>eligible(r,ex));
  else if(rFilter==='cooked')list=list.filter(r=>S.cookLog[r.id]).sort((a,b)=>S.cookLog[b.id].n-S.cookLog[a.id].n);
  if(q)list=list.filter(r=>r.n.toLowerCase().includes(q)||effIng(r).some(([id])=>INGS[id].name.toLowerCase().includes(q)));
  if(!list.length)return `<div class="empty">${rFilter==='saved'&&!q?'Noch nichts gemerkt. Tippe bei einem Rezept auf „Merken“, dann landet es hier und kommt öfter in deinen Plan.':rFilter==='cooked'&&!q?'Sobald du ein Gericht als gekocht markierst, erscheint es hier.':'Kein Rezept gefunden.'}</div>`;
  return `<p class="note">${list.length} ${list.length===1?'Rezept':'Rezepte'}</p>`+list.map(r=>{const ci=cookInfo(r),fav=S.saved.includes(r.id);
    return `<details class="meal"><summary><span class="em" aria-hidden="true">${r.e}</span><span class="mt"><span class="ml">${fav?'♥ ':''}${r.type==='f'?'Frühstück':'Hauptgericht'}${ci?', '+ci:''}</span><span class="mn">${esc(r.n)}</span></span><span class="tm"><span>${r.t} Min</span><span>${num(kcalOf(r))} kcal</span></span></summary><div class="md">${recipeBody(r,S.persons)}</div></details>`}).join('');
}
function renderRecipes(){
  if(!rFilter)rFilter=S.saved.length?'saved':'fit';
  const F=[['saved','Gemerkt ('+S.saved.length+')'],['cooked','Schon gekocht'],['fit','Passt zu mir'],['all','Alle']];
  return `<div class="rsearch"><input id="rsearch" type="search" placeholder="Rezept oder Zutat suchen" value="${esc(rQuery)}" aria-label="Rezepte durchsuchen"></div>
  <div class="chips" style="margin-bottom:14px">${F.map(([k,l])=>`<button class="chip" aria-pressed="${rFilter===k}" data-act="rfilter" data-val="${k}">${l}</button>`).join('')}</div>
  <div id="rlist">${recipeListHTML()}</div>`;
}
function mealCard(r,label,o){
  const kc=`${num(kcalOf(r))} kcal`;
  if(o.leftover){
    return `<details class="meal left ${o.done?'done':''}"><summary><span class="em" aria-hidden="true">${r.e}</span><span class="mt"><span class="ml">${label}, Reste vom Vortag</span><span class="mn">${esc(r.n)}</span></span><span class="tm"><span>aufwärmen</span><span>${kc}</span></span></summary>
    <div class="md"><p class="note">Das kochst du am Vortag in doppelter Menge. Einfach aufwärmen.</p></div></details>`;
  }
  const f=S.persons*(o.double?2:1);
  return `<details class="meal ${o.done?'done':''}"><summary><span class="em" aria-hidden="true">${r.e}</span><span class="mt"><span class="ml">${label}</span><span class="mn">${esc(r.n)}</span></span><span class="tm"><span>${r.t} Min</span><span>${kc}</span></span></summary>
  <div class="md">${o.double?'<p class="note">Doppelte Menge kochen: Die Hälfte ist für die nächste Mahlzeit.</p>':''}${recipeBody(r,f)}
  <div class="btnrow"><button class="small-btn ${o.done?'ok':''}" data-act="cook" data-val="${o.key}">${o.done?'Gekocht, rückgängig machen':'Als gekocht markieren'}</button>${o.done?'':`<button class="small-btn" data-act="${o.bfDay!=null?'swapbf':'swap'}" data-val="${o.bfDay!=null?o.bfDay:o.unit}">Anderes Gericht</button>`}</div>
  ${o.done?'':'<p class="note">„Gekocht“ zieht die Zutaten aus deinem Kühlschrank ab.</p>'}</div></details>`;
}
function renderWeek(){
  const P=S.plan,mt=mealTypes();
  let html='';
  if(P.fewRecipes)html+=`<p class="warn">Mit deinen Einstellungen passen nur wenige Rezepte, deshalb wiederholen sich manche Gerichte.</p>`;
  if(P.noBf)html+=`<p class="warn">Für deine Einstellungen gibt es kein passendes Frühstück.</p>`;
  for(let d=0;d<7;d++){
    if(!S.days.includes(d)){
      html+=`<section class="day off"><div class="day-head"><h2>${DAYS[d]}</h2></div><div class="offrow"><span>Nicht zuhause</span><button class="small-btn" data-act="dayon" data-val="${d}">Doch zuhause</button></div></section>`;continue;
    }
    let meals='',kc=0;
    if(mt.includes('frueh')&&P.bf&&P.bf[d]){const r=RBY[P.bf[d]];kc+=kcalOf(r);const key=skey(d,'frueh');meals+=mealCard(r,'Frühstück',{bfDay:d,key,done:!!S.cooked[key]})}
    for(const m of ['mittag','abend']){
      if(!mt.includes(m))continue;
      P.units.forEach((u,ui)=>{const k=u.slots.findIndex(s=>s.d===d&&s.m===m);if(k<0)return;
        const r=RBY[u.rid];kc+=kcalOf(r);const key=skey(u.slots[0].d,u.slots[0].m);
        meals+=mealCard(r,MEAL_LABEL[m],{unit:ui,key,leftover:k===1,double:u.slots.length===2&&k===0,done:!!S.cooked[key]});});
    }
    const hi=S.kcal&&kc>S.kcal*1.05;
    html+=`<section class="day"><div class="day-head"><h2>${DAYS[d]}</h2><span class="kcal ${hi?'hi':''}">${num(kc)}${S.kcal?` von ${num(S.kcal)}`:''} kcal</span></div>${meals}
    <button class="link" data-act="dayoff" data-val="${d}">An diesem Tag nicht zuhause</button></section>`;
  }
  return html;
}
function renderList(shop,store){
  const groups=CAT_ORDER.map(c=>[c,shop.items.filter(it=>it.g.cat===c).sort((a,b)=>a.g.name.localeCompare(b.g.name,'de'))]).filter(([,a])=>a.length);
  const done=shop.items.filter(it=>S.checked[it.g.id]).length;
  if(!shop.items.length)return `<div class="empty">Alles da. Für deinen Plan musst du gerade nichts einkaufen.</div>`;
  return `<div class="receipt"><div class="rtitle">Einkaufsliste ${esc(STORE_NAME[store])}</div><div class="rsub">${done} von ${shop.items.length} im Wagen</div>
  ${groups.map(([c,a])=>`<h3>${c}</h3>${a.map(it=>{
    const g=it.g,chk=!!S.checked[g.id];
    const rest=it.rest>0.05*g.pack&&!(g.unit==='EL'||g.unit==='TL')?`, Rest ca. ${fmtQty(it.rest,g.unit)}`:'';
    return `<label class="row ${chk?'done':''}"><input type="checkbox" data-check="${g.id}" ${chk?'checked':''}><span class="rn">${esc(g.name)}<small>${it.packs}× ${esc(g.packLabel)}, du brauchst ${fmtQty(it.need,g.unit)}${rest}</small></span><span class="rp">${eur(it.price)}</span></label>`;}).join('')}`).join('')}
  <div class="rtotal"><span>Summe</span><span>${eur(shop.total)}</span></div>
  <div class="rline"><span>Budget</span><span>${eur(S.budget)}</span></div>
  <div class="rline"><span>${shop.total<=S.budget?'Bleibt übrig':'Darüber'}</span><span>${eur(Math.abs(S.budget-shop.total))}</span></div>
  ${shop.fromFridge.length?`<div class="have">Schon im Kühlschrank: ${shop.fromFridge.map(g=>esc(g.name)).join(', ')}</div>`:''}
  ${shop.have.length?`<div class="have">Immer zuhause: ${shop.have.map(g=>esc(g.name)).join(', ')}</div>`:''}</div>
  <button class="btn primary finish" data-act="finish" ${done?'':'disabled'}>Abgehakte Sachen in den Kühlschrank legen</button>`;
}
function renderFridge(needs){
  const ids=Object.keys(S.fridge).filter(id=>S.fridge[id]>0);
  const opts=CAT_ORDER.filter(c=>c!=='Gewürze & Öle').map(c=>`<optgroup label="${c}">${Object.values(INGS).filter(g=>g.cat===c).map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</optgroup>`).join('');
  const first=INGS[Object.values(INGS).find(g=>g.cat==='Obst & Gemüse').id];
  let html=`<form class="fform" data-form="fadd"><label class="full">Lebensmittel<select id="fsel">${opts}</select></label><label>Menge (<span id="funit">${first.unit}</span>)<input id="famt" type="number" min="0" step="any" value="${first.pack}" inputmode="decimal"></label><button class="btn primary" type="submit" style="margin:0">Hinzufügen</button></form>`;
  if(!ids.length)html+=`<div class="empty">Dein Kühlschrank ist leer. Füge oben hinzu, was du da hast, oder hake beim Einkauf ab und lege die Sachen mit einem Tipp hierher.</div>`;
  for(const c of CAT_ORDER){
    const list=ids.filter(id=>INGS[id].cat===c).sort((a,b)=>INGS[a].name.localeCompare(INGS[b].name,'de'));
    if(!list.length)continue;
    html+=`<h3 class="fcat">${c}</h3>`+list.map(id=>{
      const g=INGS[id],have=S.fridge[id],need=needs[id]||0;
      let st;
      if(!need)st='<small class="warn2">Nicht im Plan, bald verbrauchen</small>';
      else if(have>=need-1e-6)st=`<small>Reicht für den Plan (${fmtQty(need,g.unit)} gebraucht)</small>`;
      else st=`<small>Für den Plan fehlen ${fmtQty(need-have,g.unit)}</small>`;
      return `<div class="fitem"><span class="fn">${esc(g.name)}${st}</span><button class="ib" data-act="fminus" data-val="${id}" aria-label="${esc(g.name)} weniger">−</button><span class="fq">${fmtQty(have,g.unit)}</span><button class="ib" data-act="fplus" data-val="${id}" aria-label="${esc(g.name)} mehr">+</button><button class="ib" data-act="fdel" data-val="${id}" aria-label="${esc(g.name)} entfernen">✕</button></div>`;
    }).join('');
  }
  // Rezepte mit dem, was da ist
  const ex=exTags();
  const sug=RECIPES.filter(r=>eligible(r,ex)).map(r=>{
    const main=effIng(r).filter(([id])=>!INGS[id].minor&&!S.pantry.includes(id));
    const hasN=main.filter(([id])=>(S.fridge[id]||0)>0).length;
    return {r,hasN,tot:main.length,miss:main.filter(([id])=>!(S.fridge[id]>0)).map(([id])=>INGS[id].name)};
  }).filter(x=>x.hasN>0).sort((a,b)=>(b.hasN/b.tot)-(a.hasN/a.tot)||a.miss.length-b.miss.length).slice(0,6);
  if(sug.length){
    html+=`<h2 class="group" style="font-size:1.15rem">Das kannst du daraus kochen</h2>`+sug.map(x=>`<details class="meal"><summary><span class="em" aria-hidden="true">${x.r.e}</span><span class="mt"><span class="ml">${x.hasN} von ${x.tot} Zutaten da</span><span class="mn">${esc(x.r.n)}</span></span><span class="tm"><span>${x.r.t} Min</span><span>${num(kcalOf(x.r))} kcal</span></span></summary><div class="md">${x.miss.length?`<p class="note">Fehlt noch: ${x.miss.map(esc).join(', ')}</p>`:'<p class="note">Alles da.</p>'}${recipeBody(x.r,S.persons)}</div></details>`).join('');
  }
  html+=`<h2 class="group" style="font-size:1.15rem">Immer zuhause</h2><div class="chips">${PANTRY_ORDER.slice(0,3).flatMap(c=>Object.values(INGS).filter(g=>g.cat===c)).map(g=>chip('pantry',g.id,g.name)).join('')}</div>`;
  return html;
}
function renderPlan(){
  const store=currentStore(),mult=STORE_MULT[store];
  const needs=planNeeds(S.plan),shop=shopping(needs,mult);
  const over=shop.total>S.budget,pct=Math.min(100,shop.total/S.budget*100);
  const msg=over?`${eur(shop.total-S.budget)} über deinem Budget. Tausche ein teures Gericht oder probiere ein anderes Geschäft.`:`Du bleibst ${eur(S.budget-shop.total)} unter deinem Budget.`;
  const cmp=S.stores.map(s=>[s,shopping(needs,STORE_MULT[s]).total]).sort((a,b)=>a[1]-b[1]);
  const mealsTxt=MEALS.find(m=>m[0]===S.meals)[2];
  const nFridge=Object.values(S.fridge).filter(v=>v>0).length;
  let kTxt='';
  if(S.kcal){let sum=0;S.days.forEach(d=>{if(S.plan.bf&&S.plan.bf[d])sum+=kcalOf(RBY[S.plan.bf[d]]);S.plan.units.forEach(u=>u.slots.forEach(s=>{if(s.d===d)sum+=kcalOf(RBY[u.rid])}))});
    kTxt=`<p class="bc-msg" style="margin-top:6px">Geplant im Schnitt ${num(sum/Math.max(1,S.days.length))} kcal pro Tag, dein Ziel sind ${num(S.kcal)} kcal.</p>`;}
  return `<header class="top">${BRAND}<span class="hright"><button class="link" data-act="edit">Einstellungen</button>${who()}</span></header>
  <main><h1>Deine Woche</h1><p class="sub">${S.persons} ${S.persons===1?'Person':'Personen'}, ${mealsTxt.toLowerCase()}, ${S.days.length} ${S.days.length===1?'Tag':'Tage'} zuhause</p>
  <section class="budgetcard" aria-label="Kosten"><div class="bc-top"><span class="bc-total">${eur(shop.total)}</span><span class="bc-of">noch einzukaufen bei ${esc(STORE_NAME[store])}, Budget ${eur(S.budget)}</span></div>
  <div class="meter ${over?'over':''}"><span style="width:${pct}%"></span></div><p class="bc-msg">${msg}</p>${kTxt}</section>
  ${cmp.length>1?`<div class="stores" role="group" aria-label="Geschäft wählen">${cmp.map(([s,t])=>`<button class="store" aria-pressed="${s===store}" data-act="store" data-val="${s}"><strong>${esc(STORE_NAME[s])}</strong><small>${eur(t)}</small></button>`).join('')}</div>`:''}
  <div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="${tab==='plan'}" data-act="tab" data-val="plan">Plan</button><button class="tab" role="tab" aria-selected="${tab==='list'}" data-act="tab" data-val="list">Einkauf (${shop.items.length})</button><button class="tab" role="tab" aria-selected="${tab==='fridge'}" data-act="tab" data-val="fridge">Kühlschrank (${nFridge})</button><button class="tab" role="tab" aria-selected="${tab==='recipes'}" data-act="tab" data-val="recipes">Rezepte</button></div>
  ${tab==='plan'?renderWeek():tab==='list'?renderList(shop,store):tab==='fridge'?renderFridge(needs):renderRecipes()}
  ${tab==='plan'?'<div class="actions"><button class="btn ghost" data-act="shuffle">Neu mischen</button></div>':''}
  <p class="foot">Preise und Kalorien sind Schätzwerte und können je nach Produkt, Filiale und Aktion abweichen. Salz, Pfeffer und Wasser setzen wir voraus. Deine Daten werden nur auf diesem Gerät gespeichert.</p></main>`;
}
const app=document.getElementById('app');

  return `<header class="top">${BRAND}</header><main><h1>${has?'Wer plant gerade?':'Willkommen'}</h1><p class="sub">Jede Person hat ihren eigenen Bereich mit Wochenplan, Einkaufsliste, Kühlschrank und Einstellungen.</p>
  ${has?`<div class="plist">${PR.list.map(p=>`<div class="pitem"><button class="pbtn" data-act="pick" data-val="${p.id}"><span class="av" style="background:${AV[p.color%AV.length]}">${esc(initial(p.name))}</span><span>${esc(p.name)}</span></button>${profileEdit?`<button class="ib" data-act="pdel" data-val="${p.id}" aria-label="Bereich von ${esc(p.name)} löschen">✕</button>`:''}</div>`).join('')}</div>`:''}
  <form class="fform pform" data-form="padd"><label class="full">${has?'Neue Person anlegen':'Wie heißt du?'}<input id="pname" type="text" maxlength="30" placeholder="Name eingeben" autocomplete="off"></label><button class="btn primary" type="submit" style="margin:0">${has?'Anlegen':'Los geht’s'}</button></form>
  ${has?`<button class="link" data-act="pedit">${profileEdit?'Fertig':'Personen bearbeiten'}</button>`:''}
  <p class="foot">Die Bereiche werden auf diesem Gerät gespeichert.</p></main>`;

function render(){app.innerHTML=view==='profiles'?renderProfiles():view==='wizard'?renderWizard():renderPlan()}

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const {act,key,val}=b.dataset;
  switch(act){
    case 'toggle':{const a=S[key];const i=a.indexOf(val);i<0?a.push(val):a.splice(i,1);break}
    case 'set':S[key]=val;break;
    case 'inc':S.persons=Math.min(8,S.persons+1);break;
    case 'dec':S.persons=Math.max(1,S.persons-1);break;
    case 'day':{const d=+val,i=S.days.indexOf(d);i<0?S.days.push(d):S.days.splice(i,1);break}
    case 'dayoff':{if(S.days.length<=1)return;S.days=S.days.filter(x=>x!==+val);generate(true);break}
    case 'dayon':{S.days.push(+val);generate(true);break}
    case 'kcaloff':S.kcal=0;break;
    case 'kcalon':if(!S.kcal)S.kcal=2000;break;
    case 'ftoggle':{const g=INGS[val];if((S.fridge[val]||0)>0)delete S.fridge[val];else S.fridge[val]=g.pack;break}
    case 'fplus':{const g=INGS[val];S.fridge[val]=(S.fridge[val]||0)+fstep(g);break}
    case 'fminus':{const g=INGS[val];const nv=(S.fridge[val]||0)-fstep(g);if(nv<=1e-6)delete S.fridge[val];else S.fridge[val]=nv;break}
    case 'fdel':delete S.fridge[val];break;
    case 'finish':finishShopping();tab='fridge';break;
    case 'cook':cook(val);break;
    case 'profiles':flush();view='profiles';profileEdit=false;window.scrollTo(0,0);break;
    case 'pick':loadProfile(val).then(()=>{window.scrollTo(0,0);render()});return;
    case 'fav':{const i=S.saved.indexOf(val);i<0?S.saved.push(val):S.saved.splice(i,1);break}
    case 'rfilter':rFilter=val;break;
    case 'pedit':profileEdit=!profileEdit;break;
    case 'pdel':{const p=PR.list.find(x=>x.id===val);if(!p||!confirm(`Bereich von ${p.name} löschen? Plan, Kühlschrank und Einstellungen gehen verloren.`))return;
      PR.list=PR.list.filter(x=>x.id!==val);try{localStorage.removeItem('wochenteller-p-'+val)}catch(e){}
      if(API)api('profiles/'+val,{method:'DELETE'}).catch(()=>{});
      if(PR.current===val){PR.current=null;S=null}if(!PR.list.length)profileEdit=false;saveProfiles();break}
    case 'next':
      if(step<STEPS.length-1){step++;window.scrollTo(0,0)}
      else{if(generate()){view='plan';tab='plan';window.scrollTo(0,0)}}
      break;
    case 'back':step=Math.max(0,step-1);window.scrollTo(0,0);break;
    case 'edit':view='wizard';step=0;genError='';window.scrollTo(0,0);break;
    case 'toplan':view='plan';window.scrollTo(0,0);break;
    case 'tab':tab=val;break;
    case 'store':S.store=val;break;
    case 'shuffle':generate();break;
    case 'swap':swapUnit(+val);break;
    case 'swapbf':swapBf(+val);break;
    default:return;
  }
  save();render();
});
app.addEventListener('input',e=>{
  if(e.target.id==='rsearch'){rQuery=e.target.value;const l=document.getElementById('rlist');if(l)l.innerHTML=recipeListHTML();return}
  const a=e.target.dataset.act;
  if(a==='budget'){S.budget=+e.target.value;save();document.getElementById('bval').textContent=S.budget+' €';document.getElementById('bper').textContent=perServingText()}
  if(a==='kcal'){S.kcal=+e.target.value;save();document.getElementById('kval').textContent=num(S.kcal)+' kcal';document.getElementById('khint').textContent=kcalHint()}
});
app.addEventListener('change',e=>{
  if(e.target.id==='fsel'){const g=INGS[e.target.value];document.getElementById('funit').textContent=g.unit;document.getElementById('famt').value=g.pack;return}
  const id=e.target.dataset.check;if(!id)return;
  S.checked[id]=e.target.checked;save();
  e.target.closest('.row').classList.toggle('done',e.target.checked);
  const all=[...app.querySelectorAll('[data-check]')],n=all.filter(x=>x.checked).length;
  const rs=app.querySelector('.rsub');if(rs)rs.textContent=`${n} von ${all.length} im Wagen`;
  const fb=app.querySelector('.finish');if(fb)fb.disabled=!n;
});
app.addEventListener('submit',e=>{
  if(e.target.dataset.form==='padd'){e.preventDefault();const n=document.getElementById('pname').value.trim();if(!n)return;
    (async()=>{let p={id:'p'+Date.now().toString(36),name:n,color:PR.list.length};
      if(API){try{p=await api('profiles',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})})}catch(err){alert('Die Person konnte nicht gespeichert werden. Läuft server.py noch?');return}}
      PR.list.push(p);await loadProfile(p.id);save();window.scrollTo(0,0);render()})();return}
  if(e.target.dataset.form!=='fadd')return;e.preventDefault();
  const id=document.getElementById('fsel').value,amt=parseFloat(String(document.getElementById('famt').value).replace(',','.'));
  if(!(amt>0))return;S.fridge[id]=(S.fridge[id]||0)+amt;save();render();
});
async function init(){
  if(location.protocol==='http:'){try{await api('ping');API=true}catch(e){}}
  if(API){
    try{loadRecipes(await api('recipes'))}catch(e){}
    try{PR.list=await api('profiles');saveProfiles()}catch(e){}
  }
  render();
}
init();

</script>
</body>
</html>
